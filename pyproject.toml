[project]
name = "claude-usage-tracker"
version = "0.1.0"
description = "Transparent Windows 11 desktop widget displaying Claude Code token usage and estimated costs"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7.0",
]

[project.scripts]
claude-usage-tracker = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
